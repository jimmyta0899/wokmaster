<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wokmaster 菜单实时预览 (含 Holia 导入)</title>
<style>
  :root{--bg:#0f1115;--panel:#161922;--panel2:#1d212c;--line:#2a2f3a;--txt:#e8eaf0;--sub:#9aa3b2;--acc:#ff7a45;--acc2:#ffb37a;--ok:#5ed8a0;--holia:#7aa2ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--txt);font:14px/1.55 -apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;flex-direction:column}
  header{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;background:var(--panel);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .tag{font-size:12px;color:var(--sub)}
  header input{flex:1;min-width:180px;max-width:320px;margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:7px 11px;border-radius:8px;outline:none}
  header input:focus{border-color:var(--acc)}
  .wrap{flex:1;display:flex;min-height:0}
  .list{width:320px;border-right:1px solid var(--line);overflow:auto;background:var(--panel)}
  .item{display:flex;gap:10px;padding:10px 12px;cursor:pointer;border-bottom:1px solid var(--line);align-items:center}
  .item:hover{background:var(--panel2)}
  .item.active{background:#232838;border-left:3px solid var(--acc)}
  .item img{width:46px;height:46px;border-radius:7px;object-fit:cover;background:#222;flex:none}
  .item .t{font-size:13px;line-height:1.3;flex:1;min-width:0}
  .item .t b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .t span{color:var(--sub);font-size:11.5px}
  .badge{font-size:10px;padding:1px 6px;border-radius:6px;font-weight:600;flex:none}
  .b-holia{background:rgba(122,162,255,.18);color:var(--holia)}
  .b-native{background:rgba(94,216,160,.15);color:var(--ok)}
  .detail{flex:1;overflow:auto;padding:22px 26px}
  .hero{width:100%;max-height:280px;object-fit:cover;border-radius:12px;background:#222}
  .detail h2{margin:16px 0 4px;font-size:22px}
  .detail .zh{color:var(--sub);font-size:15px;margin-bottom:12px}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12.5px;color:var(--sub)}
  .chip b{color:var(--txt);font-weight:600}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:18px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .sec h3{font-size:14px;border-bottom:1px solid var(--line);padding-bottom:7px;margin:0 0 12px;color:var(--acc2);letter-spacing:.5px}
  .ing{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
  .ing .n{font-weight:500}.ing .n small{color:var(--sub);font-weight:400}
  .ing .q{color:var(--acc);white-space:nowrap}
  .step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .step .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#1a1205;font-weight:700;display:flex;align-items:center;justify-content:center}
  .step .body{flex:1;min-width:0}
  .step .body .p{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:1px}
  .step .body .zh{color:var(--sub);margin-top:3px}
  .step img{max-width:160px;border-radius:8px;margin-top:8px;display:block;background:#222}
  .step video{max-width:240px;border-radius:8px;margin-top:8px;display:block;background:#000}
  .step .tip{margin-top:6px;font-size:12.5px;color:var(--ok);background:rgba(94,216,160,.08);padding:6px 9px;border-radius:6px}
  .empty{color:var(--sub);text-align:center;margin-top:80px}
  .err{color:#ff6b6b;padding:20px}
  a{color:var(--acc2)}
</style>
</head>
<body>
<header>
  <h1>🍜 wokmaster 菜单 · 实时预览</h1>
  <span class="tag" id="count">连接中…</span>
  <input id="search" placeholder="搜索菜谱（中/英/slug）…">
</header>
<div class="wrap">
  <div class="list" id="list"></div>
  <div class="detail" id="detail"><div class="empty">← 从左侧选择一道菜谱查看详情<br><br>（本页直接查询 wokmaster Supabase，与 app 同一查询）</div></div>
</div>
<script>
const URL='https://bkzpblmshlfvwpanbbju.supabase.co/rest/v1';
const KEY='sb_publishable_V_VbUFOfncfrSPpXkz_NGg_JnWDWY8F';
const HEAD={'apikey':KEY,'Authorization':'Bearer '+KEY,'Accept':'application/json'};
let FEED=[];
function api(path){return fetch(URL+path,{headers:HEAD}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});}
async function load(){
  // 与 app fetchRecipes 完全一致：status=published, 排除 cocktail/dessert, created_at 倒序, limit 60
  const q='/recipes?select=id,slug,title,title_zh,hero_image_url,difficulty_label,prep_time_min,cook_time_min,active_time_min,passive_time_min,servings_base,cuisine,dish_type,meal_role,data_source,spice_level&status=eq.published&dish_type=not.eq.cocktail&dish_type=not.eq.dessert&order=created_at.desc&limit=60';
  const rows=await api(q);
  FEED=rows;
  const holia=rows.filter(r=>r.data_source==='holia').length;
  document.getElementById('count').textContent='菜单共 '+rows.length+' 道（其中 Holia 导入 '+holia+' 道，原生 '+(rows.length-holia)+' 道）';
  renderList(rows);
}
function renderList(arr){
  const el=document.getElementById('list');el.innerHTML='';
  if(!arr.length){el.innerHTML='<div class="empty">没有符合条件的菜谱</div>';return;}
  arr.forEach(rec=>{
    const isH=rec.data_source==='holia';
    const d=document.createElement('div');d.className='item';
    d.innerHTML=`<img src="${rec.hero_image_url||''}" onerror="this.style.opacity=.2">
      <div class="t"><b>${esc(rec.title)}</b><span>${esc(rec.title_zh||'')}</span></div>
      <span class="badge ${isH?'b-holia':'b-native'}">${isH?'HOLIA':'native'}</span>`;
    d.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));d.classList.add('active');renderDetail(rec);};
    el.appendChild(d);
  });
  el.firstChild.click();
}
async function renderDetail(rec){
  const D=document.getElementById('detail');
  D.innerHTML='<div class="empty">加载详情…</div>';
  let ings=[],steps=[];
  try{
    [ings,steps]=await Promise.all([
      api('/ingredients?select=order_index,item,item_zh,qty,unit_metric,ingredient_category&recipe_id=eq.'+rec.id+'&order=order_index.asc'),
      api('/recipe_steps?select=step_number,phase,instruction,instruction_zh,duration_min,image_url,video_url,tip&recipe_id=eq.'+rec.id+'&order=step_number.asc')
    ]);
  }catch(e){D.innerHTML='<div class="err">详情加载失败：'+e+'</div>';return;}
  const meta=[['难度',rec.difficulty_label],['时长',`备${rec.prep_time_min}/煮${rec.cook_time_min}/动${rec.active_time_min}/静${rec.passive_time_min} 分`],
    ['份量',rec.servings_base?rec.servings_base+' 人':'-'],['菜系',rec.cuisine],['辣度','🌶'.repeat(rec.spice_level||0)||'不辣'],
    ['类型',rec.dish_type],['餐型',rec.meal_role],['来源',rec.data_source]];
  let html=`<img class="hero" src="${rec.hero_image_url||''}" onerror="this.style.opacity=.15">`;
  html+=`<h2>${esc(rec.title)}</h2><div class="zh">${esc(rec.title_zh||'')} · <span style="color:var(--sub)">slug: ${esc(rec.slug)}</span></div>`;
  html+='<div class="meta">'+meta.map(m=>`<span class="chip">${m[0]} <b>${esc(String(m[1]??''))}</b></span>`).join('')+'</div>';
  html+='<div class="grid"><div class="sec"><h3>🧺 食材 ('+ings.length+')</h3>';
  ings.forEach(x=>{const q=[x.qty,x.unit_metric].filter(Boolean).join(' ');html+=`<div class="ing"><div class="n">${esc(x.item||'')} <small>${esc(x.item_zh||'')}</small></div><div class="q">${esc(q)}</div></div>`;});
  html+='</div><div class="sec"><h3>👩‍🍳 步骤 ('+steps.length+')</h3>';
  steps.forEach(s=>{html+=`<div class="step"><div class="num">${s.step_number}</div><div class="body"><div class="p">${esc(s.phase||'')}${s.duration_min?(' · '+s.duration_min+' 分'):''}</div><div>${esc(s.instruction||'')}</div><div class="zh">${esc(s.instruction_zh||'')}</div>`;
    if(s.image_url)html+=`<img src="${s.image_url}" loading="lazy" onerror="this.remove()">`;
    if(s.video_url)html+=`<video src="${s.video_url}" controls preload="none" onerror="this.remove()"></video>`;
    if(s.tip)html+=`<div class="tip">💡 ${esc(s.tip)}</div>`;
    html+='</div></div>';});
  html+='</div></div>';
  D.innerHTML=html;D.scrollTop=0;
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
document.getElementById('search').oninput=e=>{const q=e.target.value.trim().toLowerCase();renderList(FEED.filter(r=>(r.title||'').toLowerCase().includes(q)||(r.title_zh||'').toLowerCase().includes(q)||(r.slug||'').includes(q)));};
load().catch(e=>{document.getElementById('detail').innerHTML='<div class="err">加载失败：'+e+'<br><br>请确认你的浏览器能访问 bkzpblmshlfvwpanbbju.supabase.co（本页在你的浏览器里直连数据库）。</div>';document.getElementById('count').textContent='连接失败';});
</script>
</body>
</html>
