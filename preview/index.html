<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WokMaster · Device Preview</title>
<style>
  :root{
    --app-url: "https://jimmyta0899.github.io/wokmaster/";
    --dev-w: 402px;
    --dev-h: 874px;
    --radius: 56px;
    --stage-bg: #07070A;
    --ink: #F2F2F4;
    --ink-dim: #8A8A93;
    --line: rgba(255,255,255,.09);
    --glass: rgba(255,255,255,.055);
    --accent: #E4573D;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1100px 620px at 50% -12%, rgba(228,87,61,.16), transparent 62%),
      radial-gradient(820px 520px at 88% 104%, rgba(80,110,220,.10), transparent 60%),
      var(--stage-bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,"Noto Sans SC",sans-serif;
    display:flex;
    min-height:100vh;
    overflow:hidden;
  }
  /* ---------------- 左栏 ---------------- */
  .rail{
    width:250px;flex:0 0 250px;
    padding:26px 18px;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:22px;
    overflow-y:auto;
    backdrop-filter:blur(18px);
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:34px;height:34px;border-radius:11px;flex:0 0 34px;
    background:linear-gradient(150deg,#F0755C,#C0331F);
    display:grid;place-items:center;
    box-shadow:0 6px 18px rgba(228,87,61,.32), inset 0 1px 0 rgba(255,255,255,.35);
    font-weight:800;font-size:15px;color:#fff;
  }
  .brand-name{font-size:14.5px;font-weight:700;letter-spacing:.16em}
  .brand-sub{font-size:10.5px;color:var(--ink-dim);letter-spacing:.05em;margin-top:2px}

  .sec-label{
    font-size:10px;font-weight:700;letter-spacing:.16em;
    color:var(--ink-dim);text-transform:uppercase;
    margin-bottom:9px;
  }
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{
    all:unset;cursor:pointer;
    display:flex;align-items:center;gap:10px;
    padding:8px 10px;border-radius:11px;
    font-size:12.5px;color:#C9C9D2;
    transition:background .16s ease, color .16s ease, transform .16s ease;
  }
  .nav button:hover{background:var(--glass);color:#fff}
  .nav button:active{transform:scale(.985)}
  .nav button.on{background:rgba(228,87,61,.14);color:#FFB4A2}
  .nav .p{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:10px;color:var(--ink-dim);
    margin-left:auto;
  }
  .nav button.on .p{color:#FF8A70}

  .hint{
    font-size:11px;line-height:1.65;color:var(--ink-dim);
    padding:11px 12px;border-radius:12px;
    background:var(--glass);border:1px solid var(--line);
  }
  .hint b{color:#E4E4EA;font-weight:600}

  /* ---------------- 舞台 ---------------- */
  .stage{
    flex:1;position:relative;
    display:grid;place-items:center;
    min-width:0;overflow:auto;
    padding:34px 24px;
  }
  .scaler{transform-origin:center center;transition:transform .28s cubic-bezier(.32,.72,0,1)}

  .device{
    position:relative;
    width:calc(var(--dev-w) + 26px);
    height:calc(var(--dev-h) + 26px);
    border-radius:calc(var(--radius) + 13px);
    padding:13px;
    background:
      linear-gradient(148deg,#5C5C62 0%,#2A2A2E 16%,#141416 42%,#3E3E44 68%,#1A1A1D 86%,#4A4A50 100%);
    box-shadow:
      0 44px 90px -22px rgba(0,0,0,.92),
      0 0 0 1px rgba(255,255,255,.11),
      inset 0 0 0 1.5px rgba(255,255,255,.16),
      inset 0 2px 3px rgba(255,255,255,.30);
  }
  /* 侧边实体按键 */
  .btnl{position:absolute;background:linear-gradient(90deg,#35353A,#1E1E21);border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}
  .btnl.vol-up{left:-3px;top:152px;width:3.5px;height:56px}
  .btnl.vol-dn{left:-3px;top:222px;width:3.5px;height:56px}
  .btnl.act{left:-3px;top:100px;width:3.5px;height:32px}
  .btnl.pwr{right:-3px;top:186px;width:3.5px;height:88px}

  .screen{
    position:relative;
    width:var(--dev-w);height:var(--dev-h);
    border-radius:var(--radius);
    overflow:hidden;
    background:#000;
    isolation:isolate;
  }
  .screen iframe{
    width:100%;height:100%;border:0;display:block;background:#000;
  }
  /* 屏幕内边缘高光 */
  .screen::after{
    content:"";position:absolute;inset:0;border-radius:var(--radius);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), inset 0 0 44px rgba(0,0,0,.42);
    pointer-events:none;z-index:6;
  }

  /* 灵动岛 */
  .island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:124px;height:35px;border-radius:20px;background:#000;
    z-index:8;pointer-events:none;
    display:flex;align-items:center;justify-content:flex-end;
    padding-right:11px;
    box-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  .island .cam{
    width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#2B3A52 0%,#0B1018 62%,#000 100%);
    box-shadow:inset 0 0 2px rgba(120,170,255,.55);
  }

  /* 状态栏 */
  .statusbar{
    position:absolute;top:0;left:0;right:0;height:54px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 30px;
    z-index:7;pointer-events:none;
    font-size:14px;font-weight:600;letter-spacing:.01em;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
    transition:opacity .2s ease;
  }
  .statusbar.hide{opacity:0}
  .sb-right{display:flex;align-items:center;gap:5px}
  .sb-right svg{display:block}

  /* Home indicator */
  .homebar{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    width:140px;height:5px;border-radius:3px;
    background:rgba(255,255,255,.86);
    z-index:7;pointer-events:none;
    box-shadow:0 0 4px rgba(0,0,0,.35);
    transition:opacity .2s ease;
  }
  .homebar.hide{opacity:0}

  /* 加载遮罩 */
  .boot{
    position:absolute;inset:0;z-index:9;
    display:grid;place-items:center;gap:0;
    background:#0B0B0D;
    transition:opacity .55s ease, visibility .55s ease;
  }
  .boot.gone{opacity:0;visibility:hidden}
  .boot-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
  .boot-mark{
    width:52px;height:52px;border-radius:16px;
    background:linear-gradient(150deg,#F0755C,#C0331F);
    display:grid;place-items:center;
    font-weight:800;font-size:22px;color:#fff;
    box-shadow:0 12px 34px rgba(228,87,61,.42);
    animation:pulse 1.9s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);opacity:.94}50%{transform:scale(1.055);opacity:1}}
  .boot-name{font-size:13px;font-weight:700;letter-spacing:.28em;color:#E8E8EE}
  .boot-tip{font-size:11px;color:#6E6E78;text-align:center;line-height:1.6;max-width:230px}
  .boot-timer{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;color:#55555E;letter-spacing:.06em}
  .spin{
    width:16px;height:16px;border-radius:50%;
    border:2px solid rgba(255,255,255,.14);
    border-top-color:var(--accent);
    animation:sp .8s linear infinite;margin-top:2px;
  }
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------------- 右栏 ---------------- */
  .panel{
    width:214px;flex:0 0 214px;
    padding:26px 16px;
    border-left:1px solid var(--line);
    display:flex;flex-direction:column;gap:20px;
    overflow-y:auto;
    backdrop-filter:blur(18px);
  }
  .group{display:flex;flex-direction:column;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    all:unset;cursor:pointer;
    padding:6px 10px;border-radius:8px;
    font-size:11.5px;color:#C3C3CC;
    background:var(--glass);border:1px solid var(--line);
    transition:all .15s ease;white-space:nowrap;
  }
  .chip:hover{background:rgba(255,255,255,.10);color:#fff}
  .chip.on{background:rgba(228,87,61,.18);border-color:rgba(228,87,61,.46);color:#FFB4A2}
  .chip small{opacity:.55;margin-left:4px;font-size:9.5px}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:#B8B8C1;padding:3px 0}
  .sw{width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;transition:background .2s ease;flex:0 0 34px}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .22s cubic-bezier(.32,.72,0,1)}
  .sw.on{background:var(--accent)}
  .sw.on::after{transform:translateX(14px)}

  .ghost{
    all:unset;cursor:pointer;text-align:center;
    padding:9px;border-radius:10px;font-size:11.5px;font-weight:600;
    color:#DADAE2;background:var(--glass);border:1px solid var(--line);
    transition:all .15s ease;
  }
  .ghost:hover{background:rgba(255,255,255,.10);color:#fff}
  .ghost:active{transform:scale(.98)}

  .meta{font-size:10.5px;line-height:1.7;color:#5E5E68}
  .meta code{color:#8F8F9A;font-family:ui-monospace,Menlo,monospace;font-size:10px}

  @media (max-width:1120px){
    .rail{display:none}
    .panel{width:180px;flex:0 0 180px}
  }
  @media (max-width:820px){
    body{flex-direction:column;overflow:auto}
    .panel{width:100%;flex:none;border-left:0;border-top:1px solid var(--line)}
    .stage{padding:18px 10px}
  }
</style>
</head>
<body>

<!-- ============ 左栏 ============ -->
<aside class="rail">
  <div class="brand">
    <div class="brand-mark">W</div>
    <div>
      <div class="brand-name">WOKMASTER</div>
      <div class="brand-sub">Device Preview</div>
    </div>
  </div>

  <div>
    <div class="sec-label">Screens</div>
    <div class="nav" id="nav"></div>
  </div>

  <div class="hint">
    这是 <b>真机尺寸</b> 预览：402×874 逻辑像素、灵动岛、安全区。
    直接点按钮在里面操作，和手机上一致。
  </div>
</aside>

<!-- ============ 舞台 ============ -->
<main class="stage">
  <div class="scaler" id="scaler">
    <div class="device" id="device">
      <div class="btnl act"></div>
      <div class="btnl vol-up"></div>
      <div class="btnl vol-dn"></div>
      <div class="btnl pwr"></div>

      <div class="screen" id="screen">
        <div class="boot" id="boot">
          <div class="boot-inner">
            <div class="boot-mark">W</div>
            <div class="boot-name">WOKMASTER</div>
            <div class="spin"></div>
            <div class="boot-tip" id="bootTip">Flutter 首帧编译中，通常 20–40 秒</div>
            <div class="boot-timer" id="bootTimer">0.0s</div>
          </div>
        </div>

        <iframe id="app" src="https://jimmyta0899.github.io/wokmaster/" allow="clipboard-write; clipboard-read"></iframe>

        <div class="statusbar" id="sb">
          <div class="sb-time">9:41</div>
          <div class="sb-right">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="#fff"><rect x="0" y="7.5" width="3" height="3.5" rx=".8"/><rect x="4.4" y="5.4" width="3" height="5.6" rx=".8"/><rect x="8.8" y="3" width="3" height="8" rx=".8"/><rect x="13.2" y="0" width="3" height="11" rx=".8"/></svg>
            <svg width="16" height="11" viewBox="0 0 16 11" fill="#fff"><path d="M8 10.4 5.4 7.7a3.7 3.7 0 0 1 5.2 0L8 10.4Z"/><path d="M8 6.1c1.6 0 3.1.6 4.2 1.7l1.2-1.2A7.6 7.6 0 0 0 8 4.4 7.6 7.6 0 0 0 2.6 6.6l1.2 1.2A5.9 5.9 0 0 1 8 6.1Z" opacity=".95"/><path d="M8 2.2c2.6 0 5 .9 6.8 2.5l1-1.1A11.7 11.7 0 0 0 8 .5 11.7 11.7 0 0 0 .2 3.6l1 1.1A10.2 10.2 0 0 1 8 2.2Z" opacity=".9"/></svg>
            <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3.4" fill="none" stroke="#fff" stroke-opacity=".45"/><rect x="2.2" y="2.2" width="16" height="7.6" rx="2" fill="#fff"/><path d="M23 4.2v3.6c1.1-.3 1.5-1 1.5-1.8S24.1 4.5 23 4.2Z" fill="#fff" fill-opacity=".5"/></svg>
          </div>
        </div>

        <div class="island" id="island"><div class="cam"></div></div>
        <div class="homebar" id="homebar"></div>
      </div>
    </div>
  </div>
</main>

<!-- ============ 右栏 ============ -->
<aside class="panel">
  <div class="group">
    <div class="sec-label">Device</div>
    <div class="chips" id="devices"></div>
  </div>

  <div class="group">
    <div class="sec-label">Fit</div>
    <div class="chips" id="fits"></div>
  </div>

  <div class="group">
    <div class="sec-label">Overlays</div>
    <div class="toggle-row"><span>Status bar</span><div class="sw on" id="swStatus"></div></div>
    <div class="toggle-row"><span>Home bar</span><div class="sw on" id="swHome"></div></div>
  </div>

  <div class="group">
    <div class="sec-label">Actions</div>
    <button class="ghost" id="reload">Reload app</button>
    <button class="ghost" id="openTab">Open in new tab</button>
  </div>

  <div class="meta">
    <code id="metaSrc">jimmyta0899.github.io/wokmaster</code><br>
    同域 iframe，登录态共享。
  </div>
</aside>

<script>
(function(){
  var APP = "https://jimmyta0899.github.io/wokmaster/";
  var frame = document.getElementById('app');

  /* ---------- 屏幕清单 ---------- */
  var SCREENS = [
    {label:'Home',      path:'/',           icon:'◉'},
    {label:'Browse',    path:'/browse',     icon:'▦'},
    {label:'Fridge',    path:'/fridge',     icon:'❄'},
    {label:'Tonight',   path:'/tonight',    icon:'☾'},
    {label:'Shopping',  path:'/list',       icon:'☰'},
    {label:'Growth',    path:'/growth',     icon:'↗'},
    {label:'Skill tree',path:'/progress',   icon:'⑃'},
    {label:'Badges',    path:'/badges',     icon:'◈'},
    {label:'Lessons',   path:'/lessons',    icon:'▤'},
    {label:'Events',    path:'/events',     icon:'◫'},
    {label:'Profile',   path:'/profile',    icon:'◐'},
    {label:'Login',     path:'/login',      icon:'⚿'}
  ];
  var nav = document.getElementById('nav');
  SCREENS.forEach(function(s){
    var b = document.createElement('button');
    b.innerHTML = '<span style="width:14px;text-align:center;opacity:.75">'+s.icon+'</span><span>'+s.label+'</span><span class="p">'+s.path+'</span>';
    b.addEventListener('click', function(){ go(s.path, b); });
    nav.appendChild(b);
  });
  function markNav(btn){
    Array.prototype.forEach.call(nav.children, function(c){ c.classList.remove('on'); });
    if(btn) btn.classList.add('on');
  }
  function go(path, btn){
    markNav(btn);
    startBoot();
    frame.src = APP.replace(/\/$/,'') + '/#' + path;
  }
  function startBoot(){ document.getElementById('boot').classList.remove('gone'); startTimer(); }
  function endBoot(){ document.getElementById('boot').classList.add('gone'); }

  /* ---------- 机型 ---------- */
  var DEVICES = [
    {id:'16pro',  label:'iPhone 16 Pro', w:402, h:874, r:56},
    {id:'15',     label:'iPhone 15',     w:393, h:852, r:55},
    {id:'se',     label:'iPhone SE',     w:375, h:667, r:22},
    {id:'pixel',  label:'Pixel 9',       w:412, h:915, r:40},
    {id:'ipad',   label:'iPad mini',     w:744, h:1133, r:26}
  ];
  var devBox = document.getElementById('devices');
  DEVICES.forEach(function(d){
    var c = document.createElement('button');
    c.className = 'chip' + (d.id==='16pro' ? ' on' : '');
    c.innerHTML = d.label.replace('iPhone ','') + '<small>' + d.w + '×' + d.h + '</small>';
    c.addEventListener('click', function(){
      Array.prototype.forEach.call(devBox.children, function(x){x.classList.remove('on')});
      c.classList.add('on');
      applyDevice(d);
    });
    devBox.appendChild(c);
  });
  function applyDevice(d){
    var root = document.documentElement.style;
    root.setProperty('--dev-w', d.w+'px');
    root.setProperty('--dev-h', d.h+'px');
    root.setProperty('--radius', d.r+'px');
    // SE 没有灵动岛和 home bar
    var isSE = d.id==='se';
    document.getElementById('island').style.display = isSE ? 'none' : 'flex';
    document.getElementById('homebar').style.display = isSE ? 'none' : 'block';
    fit();
  }

  /* ---------- 缩放 ---------- */
  var FITS = [{id:'auto',label:'Fit'},{id:'100',label:'1:1'},{id:'75',label:'75%'}];
  var fitBox = document.getElementById('fits');
  var fitMode = 'auto';
  FITS.forEach(function(f){
    var c = document.createElement('button');
    c.className = 'chip' + (f.id==='auto' ? ' on' : '');
    c.textContent = f.label;
    c.addEventListener('click', function(){
      Array.prototype.forEach.call(fitBox.children, function(x){x.classList.remove('on')});
      c.classList.add('on'); fitMode = f.id; fit();
    });
    fitBox.appendChild(c);
  });
  function fit(){
    var stage = document.querySelector('.stage');
    var dev = document.getElementById('device');
    var scaler = document.getElementById('scaler');
    if(fitMode === '100'){ scaler.style.transform='scale(1)'; return; }
    if(fitMode === '75'){ scaler.style.transform='scale(.75)'; return; }
    var pad = 34*2 + 20;
    var availH = stage.clientHeight - pad;
    var availW = stage.clientWidth - pad;
    var s = Math.min(availH / dev.offsetHeight, availW / dev.offsetWidth, 1);
    scaler.style.transform = 'scale(' + (s>0.2?s:0.2) + ')';
  }
  window.addEventListener('resize', fit);

  /* ---------- 遮罩开关 ---------- */
  function bindSw(id, el){
    document.getElementById(id).addEventListener('click', function(){
      this.classList.toggle('on');
      document.getElementById(el).classList.toggle('hide');
    });
  }
  bindSw('swStatus','sb');
  bindSw('swHome','homebar');

  /* ---------- 加载计时 ---------- */
  var t0 = Date.now(), timerEl = document.getElementById('bootTimer'), tipEl = document.getElementById('bootTip');
  var timer = setInterval(function(){
    var s = (Date.now()-t0)/1000;
    timerEl.textContent = s.toFixed(1) + 's';
    if(s > 34) tipEl.textContent = '冷启动偏慢，再等一会——Flutter 首帧不缓存';
    if(s > 75) tipEl.textContent = '超过 75 秒，可能网络被阻。点右侧 Reload app 重试';
  }, 100);
  function startTimer(){ t0 = Date.now(); tipEl.textContent='Flutter 首帧编译中，通常 20–40 秒'; }

  frame.addEventListener('load', function(){
    // HTML 加载完只是外壳，留 1.2s 让 canvas 出首帧
    setTimeout(endBoot, 1200);
  });

  /* ---------- 动作 ---------- */
  document.getElementById('reload').addEventListener('click', function(){
    startTimer(); frame.src = frame.src;
  });
  document.getElementById('openTab').addEventListener('click', function(){
    window.open(APP, '_blank');
  });

  /* ---------- 初始化 ---------- */
  applyDevice(DEVICES[0]);
  startTimer();
  setTimeout(fit, 60);
  setTimeout(fit, 600);
})();
</script>
</body>
</html>
